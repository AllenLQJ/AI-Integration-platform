[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub-example-echo"
version = "1.0.0"
description = "Deterministic, account-free executor plugin example for Agent Hub"
requires-python = ">=3.10"
dependencies = ["local-agent-hub>=0.3"]

[project.entry-points."agent_hub.executors"]
echo = "agent_hub_echo:plugin"

[tool.setuptools.packages.find]
where = ["src"]
