name: Core and dashboard regression

on:
  pull_request:
  # Pull requests already run on every push; building the branch again doubles the matrix.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Use a short Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hubTestTemp = Join-Path ([IO.Path]::GetPathRoot($env:RUNNER_TEMP)) 'hub-test-tmp'
          New-Item -ItemType Directory -Force -Path $hubTestTemp | Out-Null
          "TEMP=$hubTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$hubTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Hub and test/build requirements
        run: python -m pip install . setuptools wheel
      - name: Full Python regression
        run: python -m unittest discover -s tests -v
      - name: Dashboard frontend regression
        run: node --test tests/frontend/*.mjs
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify wheel dashboard resources
        shell: python
        run: |
          import zipfile
          from pathlib import Path
          wheels = list(Path('dist').glob('local_agent_hub-*.whl'))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          required = {'agent_hub/dashboard.py', 'agent_hub/dashboard_chains.py',
                      'agent_hub/dashboard_timeline.py', 'agent_hub/dashboard_http.py'}
          required.update('agent_hub/dashboard_static/' + source.name
                          for source in Path('src/agent_hub/dashboard_static').iterdir() if source.is_file())
          assert required <= packaged, sorted(required - packaged)
      - name: Check whitespace
        run: git diff --check
