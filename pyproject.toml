[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-hub"
version = "0.3.0"
description = "Local persistent task hub with portable executor plugins and command bridges"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "Pillow>=11,<13", "pywin32>=312; platform_system=='Windows'"]

[project.scripts]
agent-hub = "agent_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_hub = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.mjs"]
