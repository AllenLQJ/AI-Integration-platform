[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-hub"
version = "0.1.0"
description = "Local persistent task hub for Codex, Claude Code and Muse"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0", "pywin32>=312; platform_system=='Windows'"]

[project.scripts]
agent-hub = "agent_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
