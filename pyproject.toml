[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-hub"
version = "0.2.1"
description = "Local persistent task hub for Codex, Claude Code, Muse, Cursor and Grok Bot"
requires-python = ">=3.10"
dependencies = ["mcp==1.30.0", "httpx==0.28.1", "Pillow>=11,<13", "pywin32>=312; platform_system=='Windows'"]

[project.scripts]
agent-hub = "agent_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
